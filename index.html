<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppy Run</title>
    <link rel="icon" id="favicon" type="image/png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #87ceeb;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #touch-controls {
        position: fixed;
        left: 20px;
        bottom: 20px;
        display: grid;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
        gap: 4px;
        z-index: 10;
        touch-action: none;
        user-select: none;
      }
      #touch-controls button {
        grid-column: var(--col);
        grid-row: var(--row);
        border: none;
        border-radius: 12px;
        background: rgba(20, 20, 20, 0.45);
        color: #fff;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #touch-controls button:active {
        background: rgba(20, 20, 20, 0.7);
      }
      #touch-controls button[data-action='jump'] {
        background: rgba(255, 197, 74, 0.55);
      }
      #touch-controls button[data-action='jump']:active {
        background: rgba(255, 197, 74, 0.8);
      }
      .action-button {
        position: fixed;
        right: 20px;
        z-index: 10;
        width: 64px;
        height: 64px;
        border: none;
        border-radius: 50%;
        background: rgba(20, 20, 20, 0.45);
        color: #fff;
        font-size: 26px;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .action-button:active {
        background: rgba(20, 20, 20, 0.7);
      }
      .action-button:disabled,
      .action-button.disabled {
        opacity: 0.35;
        filter: grayscale(1);
      }
      .action-button.aiming {
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85);
      }
      #daynight-button {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 50%;
        background: rgba(20, 20, 20, 0.45);
        color: #fff;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #daynight-button:active {
        background: rgba(20, 20, 20, 0.7);
      }
      #daynight-button:disabled {
        opacity: 0.5;
      }
      #mp-corner-button {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: none;
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.55);
        color: #fff;
        padding: 10px 20px 10px 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 0 0 2px rgba(255, 213, 74, 0.7);
        animation: mp-corner-pulse 2.2s ease-in-out infinite;
      }
      .mp-corner-avatars {
        position: relative;
        width: 46px;
        height: 32px;
        flex-shrink: 0;
      }
      .mp-corner-avatars canvas {
        position: absolute;
        top: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 0 0 2px rgba(20, 20, 20, 0.55);
      }
      #mp-icon-miranda {
        left: 0;
        z-index: 1;
      }
      #mp-icon-darla {
        left: 16px;
        z-index: 2;
      }
      #mp-corner-button:hover,
      #mp-corner-button:active {
        background: rgba(20, 20, 20, 0.8);
      }
      @keyframes mp-corner-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 2px rgba(255, 213, 74, 0.7), 0 0 0 0 rgba(255, 213, 74, 0.5);
        }
        50% {
          box-shadow: 0 0 0 2px rgba(255, 213, 74, 0.9), 0 0 0 9px rgba(255, 213, 74, 0);
        }
      }
      /* Everything but the character-select cards and the multiplayer
         button stays hidden until a character's actually been picked —
         otherwise the day/night toggle and the full row of skill buttons
         (styled for constant on-screen use during play) clutter the intro
         screen and bury the one button that matters there. */
      body:not(.game-started) #touch-controls,
      body:not(.game-started) #daynight-button,
      body:not(.game-started) .action-button {
        display: none !important;
      }
      #daynight-fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
        transition: opacity 2.5s ease-in-out;
      }
      #moo-button {
        bottom: 20px;
      }
      #poop-button {
        bottom: 94px;
      }
      #dress-button {
        bottom: 168px;
      }
      /* The dog emoji on its own said "dog", not "bark" — nothing about it
         suggested noise. Two sound-wave arcs off her muzzle fix that. The
         padding-right is what shifts the emoji left to make room for them,
         since a flex box centres its content inside the padding. */
      #bark-button {
        bottom: 242px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-right: 16px;
      }
      /* Each arc is a circle with only its right-hand border drawn. */
      #bark-button::before,
      #bark-button::after {
        content: '';
        position: absolute;
        border: 3px solid transparent;
        border-right-color: #fff;
        border-radius: 50%;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
      }
      #bark-button::before {
        right: 15px;
        width: 10px;
        height: 10px;
      }
      #bark-button::after {
        right: 7px;
        width: 20px;
        height: 20px;
      }
      /* The jaw itself is inline SVG in the markup, replacing two CSS
         border-triangles. The triangles were an improvement on a tooth emoji
         but they hung in mid-air with nothing to grow out of, so they read as
         two loose spikes. Giving them gums top and bottom makes it a bite. */
      #bite-button {
        bottom: 316px;
        background: rgba(90, 10, 10, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #bite-button:active {
        background: rgba(90, 10, 10, 0.8);
      }
      #bite-button svg {
        width: 38px;
        height: 38px;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
      }
      #ball-button {
        bottom: 20px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #ball-button::after {
        content: '';
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff6b5b, #d93025 55%, #8f1f16 100%);
      }
      #ball-button:active::after {
        background: radial-gradient(circle at 35% 30%, #ff6b5b, #b5251a 55%, #7a1a12 100%);
      }
      #cheese-button {
        bottom: 94px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #call-button {
        bottom: 168px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #leash-button {
        bottom: 242px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #psychedelic-button {
        bottom: 316px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      /* Fetch, cheese, calling Darla over, the leash, and the psychedelic
         trip are all Miranda-only: everyone else's skills hide when she's
         playing, and only these show up for her. */
      .miranda-mode
        .action-button:not(#ball-button):not(#cheese-button):not(#call-button):not(#leash-button):not(
          #psychedelic-button
        ) {
        display: none;
      }
      .miranda-mode #ball-button {
        display: flex;
      }
      .miranda-mode #cheese-button {
        display: flex;
      }
      .miranda-mode #call-button {
        display: flex;
      }
      .miranda-mode #leash-button {
        display: flex;
      }
      .miranda-mode #psychedelic-button {
        display: flex;
      }
      #mp-menu,
      #character-select {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(circle at 50% 40%, rgba(40, 70, 40, 0.55), rgba(6, 10, 24, 0.88));
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease;
      }
      #mp-menu.hidden,
      #character-select.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #mp-menu h1,
      #character-select h1 {
        margin: 0;
        color: #fff;
        font-size: 28px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        letter-spacing: 0.02em;
      }
      #mp-menu .mp-choices {
        display: flex;
        gap: 16px;
      }
      #mp-menu button {
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        border: none;
        border-radius: 14px;
        padding: 14px 22px;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #mp-menu button:hover,
      #mp-menu button:active {
        background: rgba(255, 255, 255, 0.24);
        transform: translateY(-2px);
      }
      #mp-menu .mp-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 18px;
        padding: 22px 28px;
        min-width: 260px;
      }
      #mp-menu .mp-panel.hidden {
        display: none;
      }
      #mp-menu .mp-panel p {
        margin: 0;
        color: #e8e2d1;
        font-size: 14px;
        text-align: center;
      }
      #mp-host-code {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #ffd54a;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 18px;
        user-select: all;
      }
      #mp-join-code {
        font-family: inherit;
        font-size: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        width: 200px;
        text-align: center;
      }
      #mp-menu button.mp-back {
        background: transparent;
        color: #b7ab9a;
        font-size: 13px;
        font-weight: 400;
        padding: 4px 8px;
      }
      #character-select .cards {
        display: flex;
        gap: 24px;
      }
      .character-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 22px;
        border: none;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(4px);
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
        touch-action: manipulation;
      }
      .character-card:hover,
      .character-card:active {
        background: rgba(255, 255, 255, 0.24);
        transform: translateY(-4px) scale(1.03);
      }
      .character-card canvas {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .character-card span {
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      #speech-bubble {
        position: fixed;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        background: rgba(255, 255, 255, 0.92);
        color: #222;
        padding: 8px 14px;
        border-radius: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        pointer-events: none;
        z-index: 15;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #speech-bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -8px;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: rgba(255, 255, 255, 0.92);
      }
      #speech-bubble.visible {
        opacity: 1;
      }
      #dialogue-menu {
        position: fixed;
        left: 50%;
        bottom: 100px;
        transform: translateX(-50%);
        display: none;
        flex-direction: column;
        gap: 8px;
        background: rgba(20, 20, 20, 0.85);
        border-radius: 14px;
        padding: 14px;
        z-index: 16;
        min-width: 260px;
      }
      #dialogue-menu.visible {
        display: flex;
      }
      #dialogue-menu button {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }
      #dialogue-menu button:hover,
      #dialogue-menu button:active {
        background: rgba(255, 255, 255, 0.24);
      }
      #dialogue-menu button.cancel {
        background: transparent;
        color: #b7ab9a;
        text-align: center;
        font-size: 13px;
      }

      /* ---- Day/night transition ------------------------------------------
         Sits above #daynight-fade, which still does its own fade to black
         underneath as the fallback for when the face capture isn't available.
         Opacity is driven from transition.js rather than by a CSS transition,
         since the fade has to stay in step with the wipes on the canvas. */
      #transition-screen {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 42%, #241a33 0%, #140f1f 55%, #06040b 100%);
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', system-ui, cursive;
      }
      #transition-screen.to-day {
        background: radial-gradient(circle at 50% 42%, #3a2b2a 0%, #1d1518 55%, #09070a 100%);
      }
      #transition-face {
        width: min(66vw, 360px);
        height: auto;
        /* The portrait is drawn clipped to a circle, so a soft ring under it
           stops it reading as a bubble floating on the dark. */
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1), 0 18px 50px rgba(0, 0, 0, 0.55);
      }

      /* ---- Loading screen -------------------------------------------------
         Deliberately plain CSS with no JS behind it, so the title and
         background are on screen on the browser's first paint — before
         main.js (and the ~500ms of Three.js module evaluation behind it) has
         run at all. src/loading.js only takes over the dog and the status
         line, which is why those two are the only empty elements here.

         Fairy-daytime palette on purpose: this is the screen you see on a
         cold load, which always starts in daytime. */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: radial-gradient(
          circle at 50% 34%,
          #fffaeb 0%,
          #ffeecb 34%,
          #ffe0d6 58%,
          #d5e8f2 84%,
          #aed6ea 100%
        );
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', system-ui, cursive;
        transition: opacity 0.6s ease;
      }
      #loading-screen.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading-screen.gone {
        display: none;
      }
      #loading-title {
        display: flex;
        margin: 0;
        font-size: clamp(40px, 9.5vw, 78px);
        line-height: 1.1;
        font-weight: 700;
      }
      /* Each letter carries its own tilt in --r and its own bob offset in --d
         (set inline below). The rotation has to be repeated inside the
         keyframes rather than sitting on the element, since the animation
         replaces `transform` outright while it runs. */
      #loading-title span {
        display: inline-block;
        color: #ff8fb8;
        text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff,
          0 5px 0 #d9628f, 0 10px 14px rgba(90, 55, 40, 0.28);
        animation: title-bob 2.6s ease-in-out infinite;
        animation-delay: var(--d, 0s);
      }
      #loading-title .gap {
        width: 0.32em;
      }
      @keyframes title-bob {
        0%,
        100% {
          transform: rotate(var(--r, 0deg)) translateY(0);
        }
        50% {
          transform: rotate(var(--r, 0deg)) translateY(-9px);
        }
      }
      /* The colour sweep across Darla is done with CSS transforms rather than
         by redrawing a canvas, and that is not a style choice — it's the only
         way it can be smooth. World generation blocks the main thread in
         ~200ms lumps (one per chunk), so a canvas repaint gets about five
         frames a second and the sweep visibly staircases. Transform
         transitions are interpolated by the compositor, which keeps running at
         full rate while the main thread is stuck building grass.

         The reveal is a "sliding window": #loading-darla-veil holds the pale
         un-loaded version of her and is translated right by the progress,
         while the canvas inside it is translated left by the same amount so
         the image itself stays put. Net effect is the pale layer being clipped
         away from the left, over the full-colour canvas underneath. Two plain
         translations — deliberately not a scaleX pair, which would need the
         inner layer scaled by 1/progress and rasterises to an enormous texture
         early in the load. */
      #loading-darla {
        position: relative;
        width: min(88vw, 540px);
        aspect-ratio: 680 / 440;
      }
      #loading-darla canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #loading-darla-veil {
        position: absolute;
        inset: 0;
        overflow: hidden;
        will-change: transform;
        /* Softens the reveal edge. The mask lives in the veil's own box and
           the veil's left edge *is* the edge, so the fade travels with it for
           free. Without this the boundary is a dead-straight cut across her. */
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3.5%);
        mask-image: linear-gradient(90deg, transparent 0, #000 3.5%);
      }
      /* Both layers have to be promoted, not just the outer one. They move in
         opposite directions by the same amount, so if one is composited and
         the other is repainted on a main thread that's blocked building grass,
         they come apart and the pale half visibly slides against the coloured
         half underneath. */
      #loading-darla-veil canvas {
        will-change: transform;
      }
      /* The edge light, in two parts on purpose. The wrapper carries the
         silhouette mask and never moves; the band inside it is what
         translates. Putting the mask on the moving element instead means the
         mask travels too — her outline ends up offset from the actual dog by
         the progress, and since the band sits at the element's left edge it
         lands on the transparent margin beside her nose and vanishes. */
      #loading-darla-glow {
        position: absolute;
        inset: 0;
      }
      #loading-darla-glow-band {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: linear-gradient(
            90deg,
            rgba(255, 214, 122, 0) 0%,
            rgba(255, 238, 184, 0.95) 55%,
            rgba(255, 214, 122, 0) 100%
          )
          no-repeat;
        background-size: 5% 100%;
        background-position-x: -2.5%;
        will-change: transform;
        animation: darla-glow-pulse 1.1s ease-in-out infinite;
      }
      @keyframes darla-glow-pulse {
        0%,
        100% {
          opacity: 0.62;
        }
        50% {
          opacity: 1;
        }
      }
      /* The status line sits in a fixed-height slot with the text itself taken
         out of flow inside it, and that is not cosmetic. The sweep above is
         driven by a percentage translate, which is resolved against the
         element's own box — so any layout pass that recomputes that box makes
         the main thread re-commit the running animation from wherever *it*
         thinks the clock is. During world generation the main thread is
         hundreds of milliseconds behind the compositor, so the re-commit
         lands behind where the edge is actually drawn and the colour visibly
         steps backwards. Swapping the message was doing exactly that, once
         per third of the load. A reserved slot means changing the text
         reflows nothing. */
      #loading-status-slot {
        position: relative;
        align-self: stretch;
        height: 1.7em;
        font-size: clamp(14px, 3.4vw, 19px);
      }
      #loading-status {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        margin: 0;
        text-align: center;
        color: #8a6249;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-title span {
          animation: none;
          transform: rotate(var(--r, 0deg));
        }
        /* Holds the band at its mid brightness rather than the 0 the
           animation starts from, which would hide it entirely. */
        #loading-darla-glow-band {
          animation: none;
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1 id="loading-title" aria-label="Puppy Run">
        <span style="--r: -7deg; --d: 0s">P</span><span style="--r: 5deg; --d: 0.08s">u</span
        ><span style="--r: -4deg; --d: 0.16s">p</span><span style="--r: 6deg; --d: 0.24s">p</span
        ><span style="--r: -6deg; --d: 0.32s">y</span>
        <span class="gap"></span>
        <span style="--r: 5deg; --d: 0.44s">R</span><span style="--r: -5deg; --d: 0.52s">u</span
        ><span style="--r: 6deg; --d: 0.6s">n</span>
      </h1>
      <div id="loading-darla">
        <canvas id="loading-darla-ink" width="680" height="440"></canvas>
        <div id="loading-darla-veil">
          <canvas id="loading-darla-ghost" width="680" height="440"></canvas>
        </div>
        <div id="loading-darla-glow"><div id="loading-darla-glow-band"></div></div>
      </div>
      <!-- First of the three status messages, here as well as in
           LOADING_STATUS in src/loading.js so there's a caption on the
           browser's first paint, ~500ms before that module evaluates. The two
           have to say the same thing; the other two messages live only in
           loading.js. -->
      <div id="loading-status-slot"><p id="loading-status">Scooping the poop…</p></div>
    </div>
    <div id="mp-menu" class="hidden">
      <h1>Play with a friend</h1>
      <div class="mp-choices">
        <button id="mp-host" type="button">Host a Game</button>
        <button id="mp-join" type="button">Join a Game</button>
        <button id="mp-choices-back" type="button" class="mp-back">Back</button>
      </div>
      <div id="mp-host-panel" class="mp-panel hidden">
        <p>Share this code with your friend:</p>
        <div id="mp-host-code">…</div>
        <button id="mp-host-share" type="button" style="display: none">Share code</button>
        <p id="mp-host-status">Generating code…</p>
        <button id="mp-host-cancel" type="button" class="mp-back">Back</button>
      </div>
      <div id="mp-join-panel" class="mp-panel hidden">
        <p>Enter your friend's code:</p>
        <input id="mp-join-code" type="text" placeholder="code" autocomplete="off" spellcheck="false" />
        <button id="mp-join-connect" type="button">Connect</button>
        <p id="mp-join-status"></p>
        <button id="mp-join-cancel" type="button" class="mp-back">Back</button>
      </div>
    </div>
    <div id="character-select">
      <button id="mp-corner-button" type="button" title="Play with a friend">
        <span class="mp-corner-avatars">
          <canvas id="mp-icon-miranda" width="32" height="32"></canvas>
          <canvas id="mp-icon-darla" width="32" height="32"></canvas>
        </span>
        <span>Multiplayer</span>
      </button>
      <h1 id="character-select-title">Who do you want to play as?</h1>
      <div class="cards">
        <button class="character-card" id="pick-miranda" type="button">
          <canvas id="portrait-miranda" width="128" height="128"></canvas>
          <span>Miranda</span>
        </button>
        <button class="character-card" id="pick-darla" type="button">
          <canvas id="portrait-darla" width="128" height="128"></canvas>
          <span>Darla</span>
        </button>
      </div>
    </div>
    <div id="touch-controls">
      <button data-key="KeyW" style="--col:2;--row:1">&#9650;</button>
      <button data-key="KeyA" style="--col:1;--row:2">&#9664;</button>
      <button data-key="KeyS" style="--col:2;--row:3">&#9660;</button>
      <button data-key="KeyD" style="--col:3;--row:2">&#9654;</button>
      <button data-action="jump" style="--col:2;--row:2">&#8593;</button>
    </div>
    <div id="daynight-fade"></div>
    <div id="transition-screen">
      <canvas id="transition-face" width="480" height="480"></canvas>
    </div>
    <button id="daynight-button">&#9728;&#65039;</button>
    <button id="moo-button" class="action-button">&#128046;</button>
    <button id="poop-button" class="action-button">&#128169;</button>
    <button id="dress-button" class="action-button">&#128087;</button>
    <button id="bark-button" class="action-button">&#128021;</button>
    <button id="bite-button" class="action-button" aria-label="Bite">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="#fff">
        <!-- A gum line with two slim fangs. Both earlier attempts made the
             teeth wide and gave them a lower jaw to bite against, and both
             read as the letter W — wide teeth on a full-width bar merge into
             one mass with a notch in it. Long and narrow, with nothing else
             competing, is what reads as fangs. -->
        <rect x="7" y="9.5" width="18" height="3.6" rx="1.8" />
        <path d="M9 12.5h4.6L10 27z" />
        <path d="M18.4 12.5h4.6L22 27z" />
      </svg>
    </button>
    <button id="ball-button" class="action-button"></button>
    <button id="cheese-button" class="action-button">&#129472;</button>
    <button id="call-button" class="action-button">&#128227;</button>
    <button id="leash-button" class="action-button">&#129454;</button>
    <button id="psychedelic-button" class="action-button">&#127812;</button>
    <div id="speech-bubble"></div>
    <div id="dialogue-menu"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
