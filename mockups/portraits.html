<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Miranda portrait mockups</title>
    <style>
      body {
        margin: 0;
        padding: 26px;
        background: #14121a;
        color: #cfc7dc;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .row {
        display: flex;
        gap: 26px;
        align-items: flex-end;
        margin-bottom: 26px;
        flex-wrap: wrap;
      }
      .cell canvas {
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="row" id="big"></div>
    <div class="row" id="tiny"></div>

    <script>
      // Palette from COLORS in mom.js. The hair is deliberately darker than the
      // raw hairTint: at icon size a mid-brown against #ffe4d4 skin has almost
      // no contrast and the whole portrait turns to mush, which is exactly why
      // the old near-black version still read at 32px and the first pass didn't.
      const SKIN = '#ffe4d4';
      const SKIN_SHADE = '#f6d0bd';
      const HAIR = '#6e3a2c';
      const HAIR_DARK = '#47231b';
      const HAIR_LIGHT = '#a85c46';
      const LIPS = '#5e1c34';
      const EYE = '#5ea3d8';
      const EYE_DEEP = '#2f6aa6';
      const LINER = '#1a1016';
      const OUTFIT = '#1b1a22';
      const METAL = '#b8b8c2';
      const INK = '#2a1720';

      function drawCurrent(ctx, size) {
        const c = size / 2;
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(c, c);
        ctx.fillStyle = '#1f1613';
        ctx.beginPath();
        ctx.ellipse(0, c * 0.05, c * 0.82, c * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0c9a8';
        ctx.beginPath();
        ctx.arc(0, c * 0.02, c * 0.58, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1f1613';
        ctx.beginPath();
        ctx.ellipse(0, -c * 0.32, c * 0.56, c * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(217, 154, 138, 0.5)';
        [-1, 1].forEach((s) => {
          ctx.beginPath();
          ctx.ellipse(s * c * 0.38, c * 0.14, c * 0.12, c * 0.08, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = '#2f7fd1';
        [-1, 1].forEach((s) => {
          ctx.beginPath();
          ctx.arc(s * c * 0.24, -c * 0.02, c * 0.08, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = '#6b1c2e';
        ctx.beginPath();
        ctx.ellipse(0, c * 0.28, c * 0.14, c * 0.06, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function facePath(c) {
        const p = new Path2D();
        p.moveTo(-0.54 * c, -0.12 * c);
        p.quadraticCurveTo(-0.56 * c, 0.3 * c, -0.3 * c, 0.6 * c);
        p.quadraticCurveTo(0, 0.82 * c, 0.3 * c, 0.6 * c);
        p.quadraticCurveTo(0.56 * c, 0.3 * c, 0.54 * c, -0.12 * c);
        p.quadraticCurveTo(0.52 * c, -0.66 * c, 0, -0.7 * c);
        p.quadraticCurveTo(-0.52 * c, -0.66 * c, -0.54 * c, -0.12 * c);
        p.closePath();
        return p;
      }

      function hairBackPath(c) {
        const p = new Path2D();
        p.ellipse(0, 0.16 * c, 0.84 * c, 1.06 * c, 0, 0, Math.PI * 2);
        return p;
      }

      // Blunt fringe, but sitting high enough to leave a forehead and room for
      // the eyes. The first pass brought it down to the brows and her face
      // became a slot in a helmet of hair.
      function bangsPath(c) {
        const p = new Path2D();
        p.moveTo(-0.58 * c, -0.3 * c);
        p.quadraticCurveTo(-0.62 * c, -0.78 * c, 0, -0.8 * c);
        p.quadraticCurveTo(0.62 * c, -0.78 * c, 0.58 * c, -0.3 * c);
        p.lineTo(0.4 * c, -0.22 * c);
        p.quadraticCurveTo(0.2 * c, -0.34 * c, 0.04 * c, -0.21 * c);
        p.quadraticCurveTo(-0.16 * c, -0.34 * c, -0.36 * c, -0.24 * c);
        p.closePath();
        return p;
      }

      function drawEye(ctx, c, side, night, flashy, small) {
        ctx.save();
        ctx.translate(side * 0.27 * c, 0.02 * c);
        // Mirror the whole eye frame, so everything below can treat +x as
        // "outward" and be written once. Without this the almond, the lash and
        // especially the wing all point the same absolute direction, which puts
        // her left wing on the wrong side of the eye — it read as an angry brow
        // rather than as eyeliner.
        ctx.scale(side, 1);
        // Positive canthal tilt — outer corner above the inner.
        ctx.rotate(-0.13);

        const eye = new Path2D();
        eye.moveTo(-0.19 * c, 0.01 * c);
        eye.quadraticCurveTo(-0.07 * c, -0.19 * c, 0.14 * c, -0.09 * c);
        eye.quadraticCurveTo(0.2 * c, -0.04 * c, 0.19 * c, 0.02 * c);
        eye.quadraticCurveTo(0.06 * c, 0.16 * c, -0.13 * c, 0.06 * c);
        eye.closePath();

        ctx.fillStyle = '#fdfbff';
        ctx.fill(eye);

        ctx.save();
        ctx.clip(eye);
        ctx.fillStyle = EYE;
        ctx.beginPath();
        ctx.arc(0.005 * c, -0.005 * c, 0.115 * c, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = EYE_DEEP;
        ctx.beginPath();
        ctx.ellipse(0.005 * c, -0.08 * c, 0.115 * c, 0.07 * c, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = LINER;
        ctx.beginPath();
        ctx.ellipse(0.005 * c, -0.005 * c, 0.045 * c, 0.058 * c, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Heavy upper lash line — where the drama lives in her style.
        ctx.strokeStyle = LINER;
        ctx.lineWidth = (small ? 0.085 : 0.065) * c;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-0.19 * c, 0.01 * c);
        ctx.quadraticCurveTo(-0.07 * c, -0.19 * c, 0.15 * c, -0.085 * c);
        ctx.stroke();

        if (night) {
          // The wing, reaching well past the outer corner so it reads as a wing
          // rather than as a slightly thicker lash.
          ctx.fillStyle = LINER;
          ctx.beginPath();
          ctx.moveTo(0.1 * c, -0.09 * c);
          ctx.lineTo(0.46 * c, -0.32 * c);
          ctx.lineTo(0.2 * c, -0.02 * c);
          ctx.closePath();
          ctx.fill();
        }

        // Frame is already mirrored, so these are written once in outward terms.
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-0.055 * c, -0.07 * c, 0.036 * c, 0, Math.PI * 2);
        ctx.fill();
        if (!small) {
          ctx.beginPath();
          ctx.arc(0.07 * c, 0.055 * c, 0.019 * c, 0, Math.PI * 2);
          ctx.fill();
          if (flashy) star(ctx, -0.055 * c, -0.07 * c, 0.1 * c, '#ffffff', 0.9);
        }
        ctx.restore();
      }

      function star(ctx, x, y, r, colour, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = colour;
        ctx.translate(x, y);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
          const rr = i % 2 === 0 ? r : r * 0.22;
          ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawMiranda(ctx, size, { night, flashy }) {
        const c = size / 2;
        // Below about 48px the fine detail stops being detail and becomes dirt,
        // so it's dropped and the linework thickens instead.
        const small = size < 48;
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(c, c);
        ctx.lineJoin = 'round';

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, c, 0, Math.PI * 2);
        ctx.clip();
        const bg = ctx.createRadialGradient(0, -0.2 * c, 0, 0, 0, c);
        if (night) {
          bg.addColorStop(0, flashy ? '#7a52a3' : '#33294a');
          bg.addColorStop(1, flashy ? '#2b1a40' : '#1b1526');
        } else {
          bg.addColorStop(0, flashy ? '#ffdfea' : '#fff4e8');
          bg.addColorStop(1, flashy ? '#ffb3cd' : '#ffe0cd');
        }
        ctx.fillStyle = bg;
        ctx.fillRect(-c, -c, size, size);

        if (flashy && !small) {
          ctx.globalAlpha = night ? 0.22 : 0.3;
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 20; i += 2) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, c * 1.5, (i / 20) * Math.PI * 2, ((i + 1) / 20) * Math.PI * 2);
            ctx.closePath();
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        ctx.restore();

        const hair = hairBackPath(c);
        const face = facePath(c);
        const bangs = bangsPath(c);

        ctx.fillStyle = HAIR;
        ctx.fill(hair);
        ctx.save();
        ctx.clip(hair);
        ctx.fillStyle = HAIR_DARK;
        ctx.beginPath();
        ctx.moveTo(0.2 * c, -1.2 * c);
        ctx.lineTo(1.2 * c, -1.2 * c);
        ctx.lineTo(1.2 * c, 1.2 * c);
        ctx.lineTo(0.36 * c, 1.2 * c);
        ctx.closePath();
        ctx.fill();
        if (flashy) {
          ctx.strokeStyle = HAIR_LIGHT;
          ctx.lineWidth = 0.085 * c;
          ctx.beginPath();
          ctx.ellipse(0, 0.16 * c, 0.79 * c, 1.01 * c, 0, Math.PI * 0.7, Math.PI * 1.34);
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = SKIN;
        ctx.fill(face);

        if (!small) {
          // One hard cel shadow, kept to a narrow strip. Half the face in
          // shadow read as grubby rather than as lighting.
          ctx.save();
          ctx.clip(face);
          ctx.fillStyle = SKIN_SHADE;
          ctx.beginPath();
          ctx.moveTo(-1.2 * c, -1.2 * c);
          ctx.lineTo(-0.34 * c, -1.2 * c);
          ctx.quadraticCurveTo(-0.42 * c, 0.3 * c, -0.28 * c, 1.2 * c);
          ctx.lineTo(-1.2 * c, 1.2 * c);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          ctx.strokeStyle = HAIR_DARK;
          ctx.lineWidth = 0.03 * c;
          ctx.lineCap = 'round';
          [-1, 1].forEach((s) => {
            ctx.beginPath();
            ctx.moveTo(s * 0.13 * c, -0.28 * c);
            ctx.quadraticCurveTo(s * 0.3 * c, -0.37 * c, s * 0.45 * c, -0.29 * c);
            ctx.stroke();
          });
        }

        drawEye(ctx, c, -1, night, flashy, small);
        drawEye(ctx, c, 1, night, flashy, small);

        ctx.fillStyle = LIPS;
        ctx.beginPath();
        ctx.ellipse(0, 0.5 * c, 0.125 * c, 0.055 * c, 0, 0, Math.PI * 2);
        ctx.fill();
        if (!small) {
          [-1, 1].forEach((s) => {
            ctx.beginPath();
            ctx.ellipse(s * 0.05 * c, 0.452 * c, 0.058 * c, 0.03 * c, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.fillStyle = HAIR;
        ctx.fill(bangs);
        ctx.save();
        ctx.clip(bangs);
        ctx.fillStyle = HAIR_DARK;
        ctx.beginPath();
        ctx.moveTo(0.18 * c, -1.2 * c);
        ctx.lineTo(1.2 * c, -1.2 * c);
        ctx.lineTo(1.2 * c, 0.2 * c);
        ctx.lineTo(0.32 * c, 0.2 * c);
        ctx.closePath();
        ctx.fill();
        if (!small) {
          ctx.fillStyle = flashy ? HAIR_LIGHT : 'rgba(200, 122, 96, 0.55)';
          ctx.beginPath();
          ctx.ellipse(-0.18 * c, -0.58 * c, 0.32 * c, 0.08 * c, -0.16, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.fillStyle = OUTFIT;
        ctx.beginPath();
        ctx.ellipse(0, 0.98 * c, 0.4 * c, 0.15 * c, 0, 0, Math.PI * 2);
        ctx.fill();
        if (!small) {
          ctx.fillStyle = METAL;
          ctx.beginPath();
          ctx.arc(0, 0.92 * c, 0.045 * c, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ink outlines last, so nothing paints over them.
        ctx.strokeStyle = INK;
        ctx.lineWidth = (small ? 0.05 : 0.034) * c;
        ctx.stroke(face);
        ctx.stroke(hair);
        ctx.stroke(bangs);

        if (flashy && !small) {
          star(ctx, -0.68 * c, -0.46 * c, 0.14 * c, '#fff6d0', 0.95);
          star(ctx, 0.64 * c, 0.2 * c, 0.1 * c, '#fff6d0', 0.8);
          star(ctx, 0.46 * c, -0.66 * c, 0.065 * c, '#ffffff', 0.75);
        }

        ctx.restore();
      }

      const OPTIONS = [
        [(ctx, s) => drawCurrent(ctx, s), 'Current (old model)'],
        [(ctx, s) => drawMiranda(ctx, s, { night: false, flashy: false }), 'A · ink + cel · day'],
        [(ctx, s) => drawMiranda(ctx, s, { night: true, flashy: false }), 'A · ink + cel · night'],
        [(ctx, s) => drawMiranda(ctx, s, { night: false, flashy: true }), 'B · sparkle · day'],
        [(ctx, s) => drawMiranda(ctx, s, { night: true, flashy: true }), 'B · sparkle · night'],
      ];
      window.PORTRAIT_LABELS = OPTIONS.map(([, l]) => l);

      for (const [size, host] of [
        [128, 'big'],
        [32, 'tiny'],
      ]) {
        const row = document.getElementById(host);
        for (const [draw] of OPTIONS) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          canvas.style.width = size + 'px';
          canvas.style.height = size + 'px';
          cell.appendChild(canvas);
          row.appendChild(cell);
          draw(canvas.getContext('2d'), size);
        }
      }
    </script>
  </body>
</html>
